[project]
name = "fluidmeet-mcp"
version = "0.1.0"
description = "Read-only MCP server for FluidVoice (FluidMeet) meetings on macOS"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["mcp>=1.2,<2"]

[project.scripts]
fluidmeet-mcp = "fluidmeet_mcp:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["fluidmeet_mcp.py"]
